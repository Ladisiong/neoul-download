name: mail-backlog (manual backup)

# NOTE(2026-07-08): 주 파이프라인은 Supabase 트리거(os_inbox → os_backlog).
# 이 IMAP 워커는 "진짜 24/7 실시간" 업그레이드용 수동 백업이다.
# 활성화하려면 repo Secrets에 SUPABASE_SERVICE_KEY + MAIL_*_USER/PASS 등록 후 수동 실행.
# 자동 크론 비활성(빈 실행 스팸·os_inbox 경로와 thread_id 중복 방지).

on:
  workflow_dispatch: {}

concurrency:
  group: mail-backlog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i imapflow@1
      - run: node scripts/mail_backlog.mjs
        env:
          SUPABASE_URL: https://iwrblahmszuthemfrhmy.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAIL_PERSONAL_USER: ${{ secrets.MAIL_PERSONAL_USER }}
          MAIL_PERSONAL_PASS: ${{ secrets.MAIL_PERSONAL_PASS }}
          MAIL_COMPANY_USER: ${{ secrets.MAIL_COMPANY_USER }}
          MAIL_COMPANY_PASS: ${{ secrets.MAIL_COMPANY_PASS }}
          MAIL_NAVER_USER: ${{ secrets.MAIL_NAVER_USER }}
          MAIL_NAVER_PASS: ${{ secrets.MAIL_NAVER_PASS }}

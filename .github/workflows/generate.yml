name: NEOUL 무료자료 자동생성 (2일·전과목·3축)
on:
  schedule:
    - cron: '0 21 */2 * *'   # 06:00 KST (UTC+9) 이틀마다
  workflow_dispatch: {}        # 수동 실행 버튼(첫 검증용)
permissions:
  contents: write
concurrency:
  group: neoul-generate
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LibreOffice + Korean fonts + ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk ghostscript
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate (3-axis: Claude/OpenAI/Gemini)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/generate.mjs
      - name: Commit & push (Vercel auto-deploy)
        run: |
          git config user.name "neoul-bot"
          git config user.email "bot@neoulai.com"
          git add frontend/materials frontend/materials.json
          git commit -m "chore(auto): 무료자료 전과목 자동생성 $(date -u +%F)" || { echo "변경 없음"; exit 0; }
          git push

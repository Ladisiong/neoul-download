name: NEOUL auto-generate (2day all-subject 3axis)
on:
  schedule:
    - cron: '0 21 */2 * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: neoul-generate
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LibreOffice Korean fonts ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk ghostscript
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate 3-axis Claude OpenAI Gemini
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/generate.mjs
      - name: Commit and push (Vercel auto-deploy)
        run: |
          git config user.name "neoul-bot"
          git config user.email "bot@neoulai.com"
          git add frontend/materials frontend/materials.json
          git commit -m "chore(auto): materials $(date -u +%F)" || { echo "no change"; exit 0; }
          git push
